[package]
name = "nexar-rdma"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "RDMA and GPUDirect transport extensions for nexar"
license.workspace = true
repository.workspace = true
keywords = ["rdma", "infiniband", "gpudirect", "distributed", "hpc"]
readme = "README.md"
categories = ["network-programming"]

[dependencies]
nexar.workspace = true
libc = "0.2"
crossbeam-queue.workspace = true
futures = "0.3"
tokio.workspace = true
tracing.workspace = true

# Optional: GPUDirect RDMA (GPU memory → NIC directly)
cudarc = { workspace = true, optional = true }

# libibverbs bindings from the system rdma-core headers (see build.rs).
# bindgen 0.71 emits opaque structs under libclang 22+. 0.72.1 does not.
[build-dependencies]
bindgen = { version = "0.72.1", default-features = false, features = ["runtime", "prettyplease"] }
pkg-config = "0.3.32"

[features]
default = []
gpudirect = ["dep:cudarc"]
